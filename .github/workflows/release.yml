name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            constraints: constraints/python312.txt
          - python-version: "3.13"
            constraints: constraints/python313.txt

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraints }}

      - name: Install package and development tools
        run: python -m pip install -c ${{ matrix.constraints }} -e ".[dev]"

      - name: Verify dependency environment
        run: python -m pip check

      - name: Test
        run: python -m pytest -m "not integration"

      - name: Static quality and dependency audit
        if: matrix.python-version == '3.13'
        run: sh scripts/quality.sh --skip-tests

  mutation:
    name: Mutation regression gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/python313.txt

      - name: Install package and development tools
        run: python -m pip install -c constraints/python313.txt -e ".[dev]"

      - name: Verify dependency environment
        run: python -m pip check

      - name: Run mutation regression gate
        run: |
          ./scripts/mutmut.sh fresh
          ./scripts/mutmut.sh check

  build:
    name: Build release distributions
    needs: [test, mutation]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=5"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test wheel
        run: python scripts/check_wheel.py

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/muc-banbot
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
