[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muc-banbot"
dynamic = ["version"]
description = "XMPP multi-room ban management and moderation bot"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "~creme", email = "creme@envs.net" },
]
dependencies = [
    "slixmpp>=1.8.0",
    "aiosqlite>=0.18.0",
    "psutil>=5.9.0",
]
keywords = ["xmpp", "muc", "moderation", "banbot", "rtbl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/envs-net/muc_banbot"
Repository = "https://github.com/envs-net/muc_banbot"
Issues = "https://github.com/envs-net/muc_banbot/issues"

[project.scripts]
muc_banbot = "banbot.bot:main"

[project.optional-dependencies]
omemo = ["slixmpp-omemo>=2,<3"]
dev = [
    "hypothesis>=6",
    "mutmut>=3",
    "pytest>=8,<10",
    "pytest-asyncio>=1",
    "pytest-cov>=4",
    "pytest-mock>=3",
]

[tool.setuptools]
py-modules = ["muc_banbot", "config_sample"]

[tool.setuptools.packages.find]
where = ["."]
include = ["banbot*"]
exclude = ["tests*", "mutants*"]

[tool.setuptools.dynamic]
version = { attr = "banbot._version.__version__" }

[tool.setuptools.data-files]
"." = ["avatar.png"]

[tool.mutmut]
source_paths = [
    "banbot/utils.py",
    "banbot/rtbl/apply.py",
]

also_copy = [
    "banbot",
    "tests",
    "pytest.ini",
    ".coveragerc",
]

pytest_add_cli_args_test_selection = [
    "tests/test_utils.py",
    "tests/test_utils_properties.py",
    "tests/test_utils_mutation_extra.py",
    "tests/test_rtbl_apply_extra.py",
    "tests/test_rtbl_apply_db_extra.py",
    "tests/test_rtbl_apply_mutation_extra.py",
]

pytest_add_cli_args = [
    "-q",
    "-m",
    "not integration",
]

# Logging text is operational telemetry rather than functional behavior.
# Excluding logger calls keeps mutation results focused on state changes,
# return values, persistence, messages, and moderation actions.
do_not_mutate_patterns = [
    "log\\.\\w+",
]
