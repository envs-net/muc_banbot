[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muc-banbot"
dynamic = ["version"]
description = "XMPP multi-room ban management and moderation bot"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    { name = "~creme", email = "creme@envs.net" },
]
dependencies = [
    "envs-xmpp>=1.1.0,<2.0",
    "slixmpp>=1.8,<2",
    "aiosqlite>=0.20,<1",
    "psutil>=5.9,<8",
]
keywords = ["xmpp", "muc", "moderation", "banbot", "rtbl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/envs-net/muc_banbot"
Documentation = "https://github.com/envs-net/muc_banbot/blob/main/docs/README.md"
Repository = "https://github.com/envs-net/muc_banbot"
Issues = "https://github.com/envs-net/muc_banbot/issues"

[project.scripts]
muc_banbot = "banbot.cli:main"

[project.optional-dependencies]
omemo = ["slixmpp-omemo>=2,<3"]
dev = [
    "hypothesis>=6",
    "mutmut>=3",
    "mypy>=1.8,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.9,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1",
    "pytest-cov>=4",
    "pytest-mock>=3",
]

[tool.setuptools]
py-modules = ["muc_banbot", "config_sample"]

[tool.setuptools.packages.find]
where = ["."]
include = ["banbot*"]
exclude = ["tests*", "mutants*"]

[tool.setuptools.dynamic]
version = { attr = "banbot._version.__version__" }

[tool.setuptools.package-data]
banbot = ["bundled/*.png"]

[tool.mutmut]
source_paths = [
    "banbot/utils.py",
    "banbot/rtbl/apply.py",
]

also_copy = [
    "banbot",
    "tests",
    "pytest.ini",
    ".coveragerc",
]

pytest_add_cli_args_test_selection = [
    "tests/test_utils.py",
    "tests/test_utils_properties.py",
    "tests/test_utils_mutation_extra.py",
    "tests/test_rtbl_apply_extra.py",
    "tests/test_rtbl_apply_db_extra.py",
    "tests/test_rtbl_apply_mutation_extra.py",
]

pytest_add_cli_args = [
    "-q",
    "-m",
    "not integration",
]

# Logging text is operational telemetry rather than functional behavior.
# Excluding logger calls keeps mutation results focused on state changes,
# return values, persistence, messages, and moderation actions.
do_not_mutate_patterns = [
    "log\\.\\w+",
]
[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["mutants", ".venv", "venv"]

[tool.ruff.lint]
# Keep the default correctness gate intentionally small; quality.sh adds F401
# explicitly so dead imports are caught in tests as well as production code.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.isort]
# `config.py` is a repository-local module. Keep its import classification explicit
# so Ruff versions agree on first-party/third-party grouping.
known-first-party = ["banbot", "config"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.envs-xmpp.quality]
compile-targets = ["muc_banbot.py", "banbot", "scripts"]
ruff-targets = ["muc_banbot.py", "banbot", "scripts"]
mypy-targets = ["banbot/ban_target.py", "banbot/utils.py", "banbot/cache.py", "banbot/ban_queries.py", "banbot/contracts.py", "banbot/db.py", "banbot/moderation.py", "banbot/admin.py", "banbot/commands/constants.py", "banbot/commands/context.py", "banbot/commands/entrypoint.py", "banbot/commands/router.py", "banbot/commands/registry.py", "banbot/commands/moderation.py", "banbot/commands/rooms.py", "banbot/commands/rtbl.py", "banbot/commands/rtbl_admin.py", "banbot/sync.py", "banbot/occupants.py", "banbot/muc.py", "banbot/rooms", "banbot/protections", "banbot/rtbl", "banbot/task_supervisor.py", "banbot/runtime_watchdog.py", "scripts/deploy.py"]
mypy-args = ["--follow-imports=skip"]

[[tool.envs-xmpp.quality.project-checks]]
name = "Configuration sample syntax"
command = ["python", "-m", "py_compile", "config_sample.py"]


[[tool.envs-xmpp.quality.project-checks]]
name = "Shared-core release audit"
command = ["python", "-m", "envs_xmpp_ops.release_audit"]

[tool.envs-xmpp.testing]
marker = "not integration"
coverage-source = "banbot"
coverage-report = "term-missing"
coverage-fail-under = 55
