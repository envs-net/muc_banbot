---
kind: pipeline
type: docker
name: pytest

steps:
  - name: build pytest
    image: python:3.13
    commands:
      - python --version
      - python -m pip install --upgrade pip setuptools wheel
      - cp config_sample.py config.py
      - pip install -r requirements.txt
      - pip install -r requirements-dev.txt
      - python -m compileall -q banbot tests
      - pytest --cov=banbot --cov-report=term-missing --cov-fail-under=55

trigger:
  branch:
    - main
  event:
    - push
    - tag

---
kind: pipeline
type: docker
name: mutmut

steps:
  - name: mutation tests
    image: python:3.13
    commands:
      - python --version
      - python -m pip install --upgrade pip setuptools wheel
      - cp config_sample.py config.py
      - pip install -r requirements.txt
      - pip install -r requirements-dev.txt
      - PYTHONPATH="$PWD" mutmut run
      - mutmut results

trigger:
  event:
    - tag
